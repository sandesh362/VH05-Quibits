<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>RAG lab · Industrial Troubleshooting</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: {
              sans: ['ui-sans-serif', 'system-ui', 'Segoe UI', 'Roboto', 'sans-serif'],
              mono: ['ui-monospace', 'SFMono-Regular', 'Menlo', 'Consolas', 'monospace'],
            },
          },
        },
      };
    </script>
    <style>
      body { background: #0f1115; color: #e6e9ef; }
      .card { background: #171a21; border: 1px solid #2a2f3a; border-radius: 12px; }
      .field {
        width: 100%; background: #0f1115; border: 1px solid #3a4150; color: #e6e9ef;
        border-radius: 8px; padding: 0.55rem 0.75rem; font-size: 0.9rem;
      }
      .field:focus { outline: 2px solid #58a6ff; outline-offset: 1px; }
      .btn {
        min-height: 40px; padding: 0 1rem; border-radius: 8px; font-weight: 600; font-size: 0.9rem;
      }
      .btn-primary { background: #238636; color: white; }
      .btn-primary:hover:not(:disabled) { background: #2ea043; }
      .btn-ghost { background: #1e222b; border: 1px solid #3a4150; color: #e6e9ef; }
      .btn-ghost:hover:not(:disabled) { background: #2a2f3a; }
      .btn:disabled { opacity: 0.5; cursor: not-allowed; }
      pre { white-space: pre-wrap; word-break: break-word; }
    </style>
  </head>
  <body class="min-h-screen font-sans">
    <header class="border-b border-zinc-800 bg-[#171a21] sticky top-0 z-10">
      <div class="max-w-6xl mx-auto px-4 py-3 flex flex-wrap items-center justify-between gap-3">
        <div>
          <a href="/" class="text-sm font-semibold text-zinc-100 no-underline">Industrial Troubleshooting</a>
          <p class="text-xs text-zinc-500">Phase 4 lab · retrieval + grounded answers</p>
        </div>
        <div class="flex items-center gap-2 text-xs">
          <a href="/" class="text-sky-400 hover:underline">Home</a>
          <span class="text-zinc-600">·</span>
          <a href="/status" class="text-sky-400 hover:underline">Status</a>
          <span id="user-chip" class="ml-2 text-zinc-400"></span>
        </div>
      </div>
    </header>

    <main class="max-w-6xl mx-auto px-4 py-6 grid gap-4">
      <section id="status-strip" class="card p-4 grid sm:grid-cols-4 gap-3 text-sm"></section>

      <section class="card p-4">
        <h2 class="text-base font-semibold mb-3">Sign in</h2>
        <p class="text-xs text-zinc-500 mb-3">
          RAG endpoints need a JWT with <code class="text-zinc-300">manual.read</code>.
          First account on an empty database becomes admin.
        </p>
        <form id="login-form" class="grid sm:grid-cols-3 gap-3 items-end">
          <label class="text-xs text-zinc-400">Email
            <input class="field mt-1" name="email" type="email" autocomplete="username" required />
          </label>
          <label class="text-xs text-zinc-400">Password
            <input class="field mt-1" name="password" type="password" autocomplete="current-password" required />
          </label>
          <div class="flex gap-2">
            <button class="btn btn-primary flex-1" type="submit">Sign in</button>
            <button class="btn btn-ghost" type="button" id="logout-btn">Sign out</button>
          </div>
        </form>
        <p id="auth-msg" class="text-xs mt-2 text-zinc-400"></p>
      </section>

      <section class="grid lg:grid-cols-2 gap-4">
        <div class="card p-4">
          <h2 class="text-base font-semibold mb-3">Scope</h2>
          <div class="grid gap-3">
            <label class="text-xs text-zinc-400">Machine model
              <select id="model-select" class="field mt-1">
                <option value="">— none (clarification expected) —</option>
              </select>
            </label>
            <label class="text-xs text-zinc-400">Manual (optional)
              <select id="manual-select" class="field mt-1">
                <option value="">— any in-scope manual —</option>
              </select>
            </label>
            <div class="grid sm:grid-cols-2 gap-3">
              <label class="text-xs text-zinc-400">New model manufacturer
                <input id="new-mfr" class="field mt-1" placeholder="Haas" />
              </label>
              <label class="text-xs text-zinc-400">Model name
                <input id="new-model" class="field mt-1" placeholder="VF-2SS" />
              </label>
            </div>
            <button id="create-model-btn" class="btn btn-ghost" type="button">Create machine model</button>
          </div>
        </div>

        <div class="card p-4">
          <h2 class="text-base font-semibold mb-3">Upload a manual PDF</h2>
          <form id="upload-form" class="grid gap-3">
            <label class="text-xs text-zinc-400">Title
              <input class="field mt-1" name="title" placeholder="Hydraulic Service Manual" required minlength="3" />
            </label>
            <div class="grid sm:grid-cols-2 gap-3">
              <label class="text-xs text-zinc-400">Type
                <select class="field mt-1" name="documentType">
                  <option value="service">service</option>
                  <option value="troubleshooting">troubleshooting</option>
                  <option value="maintenance">maintenance</option>
                  <option value="operation">operation</option>
                  <option value="safety">safety</option>
                </select>
              </label>
              <label class="text-xs text-zinc-400">Version
                <input class="field mt-1" name="documentVersion" placeholder="2.1" />
              </label>
            </div>
            <label class="text-xs text-zinc-400">PDF
              <input class="field mt-1" name="file" type="file" accept="application/pdf" required />
            </label>
            <button class="btn btn-ghost" type="submit">Upload &amp; process</button>
          </form>
          <p id="upload-msg" class="text-xs mt-2 text-zinc-400"></p>
        </div>
      </section>

      <section class="card p-4">
        <h2 class="text-base font-semibold mb-3">Ask</h2>
        <div class="flex flex-wrap gap-2 mb-3" id="samples"></div>
        <textarea id="query" class="field min-h-[96px]" placeholder="Why is error E-104 appearing during hydraulic startup?"></textarea>
        <div class="flex flex-wrap gap-2 mt-3">
          <button id="search-btn" class="btn btn-ghost" type="button">Search only</button>
          <button id="answer-btn" class="btn btn-primary" type="button">Grounded answer</button>
          <button id="debug-btn" class="btn btn-ghost" type="button">Debug (admin)</button>
        </div>
        <p id="ask-msg" class="text-xs mt-2 text-zinc-400"></p>
      </section>

      <section class="card p-4">
        <div class="flex items-center justify-between gap-3 mb-3">
          <h2 class="text-base font-semibold">Result</h2>
          <label class="text-xs text-zinc-500 flex items-center gap-2">
            <input id="show-raw" type="checkbox" /> raw JSON
          </label>
        </div>
        <div id="result" class="text-sm text-zinc-400">Run a search or ask a question.</div>
      </section>
    </main>

    <script>
      const API = '/api/v1';
      const KEY = 'itp.lab.session';
      const SAMPLES = [
        'Why is error E-104 appearing during hydraulic startup?',
        'What should I check for error E-140?',
        'What colour should we paint the hopper?',
        'What is the supply voltage and the M12 x 1.5 fitting?',
      ];

      const $ = (id) => document.getElementById(id);
      const session = {
        get() {
          try { return JSON.parse(sessionStorage.getItem(KEY) || 'null'); } catch { return null; }
        },
        set(v) { sessionStorage.setItem(KEY, JSON.stringify(v)); },
        clear() { sessionStorage.removeItem(KEY); },
      };

      function token() { return session.get()?.accessToken || ''; }

      async function api(path, { method = 'GET', body, form, timeoutMs = 20000 } = {}) {
        const ctrl = new AbortController();
        const timer = setTimeout(() => ctrl.abort(), timeoutMs);
        const headers = { Accept: 'application/json' };
        if (token()) headers.Authorization = `Bearer ${token()}`;
        if (body && !form) headers['Content-Type'] = 'application/json';
        let res;
        try {
          res = await fetch(`${API}${path}`, {
            method,
            headers,
            body: form ? body : body ? JSON.stringify(body) : undefined,
            signal: ctrl.signal,
          });
        } catch (err) {
          clearTimeout(timer);
          if (ctrl.signal.aborted) throw new Error('Request timed out.');
          throw new Error('Cannot reach the API. Start the backend (`npm run dev:backend`).');
        }
        clearTimeout(timer);
        let json;
        try { json = await res.json(); } catch { throw new Error(`Non-JSON response (HTTP ${res.status})`); }
        if (!json || json.success === false) {
          const err = json?.error || {};
          const extra = (err.details || []).map((d) => `${d.field}: ${d.issue}`).join('; ');
          throw new Error([err.code, err.message, extra].filter(Boolean).join(' — ') || `HTTP ${res.status}`);
        }
        return json.data;
      }

      function badge(status) {
        const map = {
          ok: 'bg-emerald-500/15 text-emerald-400',
          answered: 'bg-emerald-500/15 text-emerald-400',
          retrieved: 'bg-sky-500/15 text-sky-400',
          degraded: 'bg-amber-500/15 text-amber-400',
          down: 'bg-red-500/15 text-red-400',
          insufficient_evidence: 'bg-amber-500/15 text-amber-400',
          clarification_required: 'bg-sky-500/15 text-sky-400',
          conflicting_evidence: 'bg-amber-500/15 text-amber-400',
          processing_unavailable: 'bg-red-500/15 text-red-400',
          generation_failed: 'bg-red-500/15 text-red-400',
        };
        const cls = map[status] || 'bg-zinc-500/15 text-zinc-300';
        return `<span class="inline-flex items-center rounded-full px-2 py-0.5 text-xs font-medium ${cls}">${status}</span>`;
      }

      function renderStatus(health, ready, info) {
        const checks = (ready?.checks || []).map((c) =>
          `<div><div class="text-zinc-500 text-xs">${c.name}</div><div class="mt-1">${badge(c.status)}</div></div>`
        ).join('');
        $('status-strip').innerHTML = `
          <div><div class="text-zinc-500 text-xs">API</div><div class="mt-1">${badge(health?.status || 'down')}</div>
            <div class="text-[11px] text-zinc-500 mt-1">${info?.phase || 'unreachable'}</div></div>
          <div><div class="text-zinc-500 text-xs">Ready</div><div class="mt-1">${badge(ready?.status || 'down')}</div></div>
          ${checks || '<div class="text-zinc-500 text-xs">No probes yet</div>'}
        `;
      }

      function paintUser() {
        const s = session.get();
        $('user-chip').textContent = s?.user ? `${s.user.username} · ${s.user.role}` : 'not signed in';
      }

      async function loadStatus() {
        try {
          const [health, ready, info] = await Promise.all([
            api('/health'),
            api('/ready', { timeoutMs: 25000 }),
            api('/system/info'),
          ]);
          renderStatus(health, ready, info);
        } catch (err) {
          $('status-strip').innerHTML = `<p class="text-red-400 text-sm">${err.message}</p>`;
        }
      }

      async function loadModels() {
        const select = $('model-select');
        const current = select.value;
        select.innerHTML = '<option value="">— none (clarification expected) —</option>';
        if (!token()) return;
        const models = await api('/machine-models?limit=100');
        (models || []).forEach((m) => {
          const opt = document.createElement('option');
          opt.value = m.id;
          opt.textContent = `${m.manufacturer} ${m.modelName}`;
          select.appendChild(opt);
        });
        if (current) select.value = current;
        await loadManuals();
      }

      async function loadManuals() {
        const select = $('manual-select');
        const current = select.value;
        select.innerHTML = '<option value="">— any in-scope manual —</option>';
        if (!token()) return;
        const modelId = $('model-select').value;
        const q = modelId ? `?limit=100&machineModelId=${modelId}` : '?limit=100';
        const manuals = await api(`/manuals${q}`);
        (manuals || []).forEach((m) => {
          const opt = document.createElement('option');
          opt.value = m.id;
          opt.textContent = `${m.title} v${m.documentVersion || '?'} · ${m.processingStatus} · ${m.indexedChunkCount} chunks`;
          select.appendChild(opt);
        });
        if (current) select.value = current;
      }

      function scopeBody(query) {
        const body = { query };
        if ($('model-select').value) body.machineModelId = $('model-select').value;
        if ($('manual-select').value) body.manualId = $('manual-select').value;
        return body;
      }

      let lastResult = null;
      function renderResult(data) {
        lastResult = data;
        const raw = $('show-raw').checked;
        if (raw) {
          $('result').innerHTML = `<pre class="font-mono text-xs text-zinc-300">${escapeHtml(JSON.stringify(data, null, 2))}</pre>`;
          return;
        }
        const sources = (data.sources || data.results || []).map((s) => {
          const title = s.manualTitle || s.manual_title || 'Untitled';
          const ver = s.manualVersion || s.manual_version || '';
          const pages = s.pageStart || s.page_start
            ? `pp. ${s.pageStart || s.page_start}${s.pageEnd && s.pageEnd !== s.pageStart ? '–' + s.pageEnd : ''}`
            : '';
          const section = s.sectionTitle || s.section_title || '';
          const snippet = s.text ? `<p class="mt-1 text-zinc-400 text-xs">${escapeHtml(s.text.slice(0, 280))}${s.text.length > 280 ? '…' : ''}</p>` : '';
          return `<li class="border border-zinc-800 rounded-lg p-3 bg-[#0f1115]">
            <div class="font-medium text-zinc-200">${escapeHtml(title)} ${escapeHtml(ver)}</div>
            <div class="text-xs text-zinc-500">${escapeHtml([pages, section].filter(Boolean).join(' · '))}</div>
            ${snippet}
          </li>`;
        }).join('');
        const retrieval = data.retrieval || {};
        const warnings = (data.warnings || []).map((w) => `<li>${escapeHtml(w)}</li>`).join('');
        $('result').innerHTML = `
          <div class="flex flex-wrap items-center gap-2 mb-3">
            ${badge(data.status || 'unknown')}
            ${data.confidence ? `<span class="text-xs text-zinc-500">confidence ${escapeHtml(data.confidence)}</span>` : ''}
            ${data.evidenceSufficient === false ? '<span class="text-xs text-amber-400">evidence insufficient</span>' : ''}
          </div>
          ${data.message ? `<p class="mb-3 text-amber-200">${escapeHtml(data.message)}</p>` : ''}
          ${data.answer ? `<article class="prose prose-invert max-w-none whitespace-pre-wrap text-zinc-200 mb-4">${escapeHtml(data.answer)}</article>` : ''}
          <p class="text-xs text-zinc-500 mb-2">
            exact ${retrieval.exactMatches ?? retrieval.exact_matches ?? 0}
            · semantic ${retrieval.semanticMatches ?? retrieval.semantic_matches ?? 0}
            · context ${retrieval.finalContextChunks ?? retrieval.final_context_chunks ?? (data.results || []).length}
          </p>
          ${warnings ? `<ul class="text-xs text-amber-300 list-disc pl-5 mb-3">${warnings}</ul>` : ''}
          ${sources ? `<ol class="grid gap-2">${sources}</ol>` : '<p class="text-zinc-500">No sources.</p>'}
        `;
      }

      function escapeHtml(s) {
        return String(s ?? '').replace(/[&<>"']/g, (c) => ({
          '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;',
        }[c]));
      }

      $('samples').innerHTML = SAMPLES.map((q) =>
        `<button type="button" class="btn btn-ghost text-xs sample">${escapeHtml(q)}</button>`
      ).join('');
      document.querySelectorAll('.sample').forEach((btn) => {
        btn.addEventListener('click', () => { $('query').value = btn.textContent; });
      });

      $('login-form').addEventListener('submit', async (e) => {
        e.preventDefault();
        const fd = new FormData(e.target);
        $('auth-msg').textContent = 'Signing in…';
        try {
          const data = await api('/auth/login', {
            method: 'POST',
            body: { email: fd.get('email'), password: fd.get('password') },
          });
          session.set(data);
          paintUser();
          $('auth-msg').textContent = `Signed in as ${data.user.username} (${data.user.role}).`;
          await loadModels();
        } catch (err) {
          $('auth-msg').textContent = err.message;
        }
      });

      $('logout-btn').addEventListener('click', async () => {
        try {
          if (token()) await api('/auth/logout', { method: 'POST', body: {} });
        } catch { /* ignore */ }
        session.clear();
        paintUser();
        $('auth-msg').textContent = 'Signed out.';
      });

      $('create-model-btn').addEventListener('click', async () => {
        try {
          await api('/machine-models', {
            method: 'POST',
            body: {
              manufacturer: $('new-mfr').value || 'Haas',
              modelName: $('new-model').value || 'VF-2SS',
              machineType: 'cnc_mill',
            },
          });
          await loadModels();
          $('auth-msg').textContent = 'Machine model created.';
        } catch (err) {
          $('auth-msg').textContent = err.message;
        }
      });

      $('model-select').addEventListener('change', () => loadManuals().catch((e) => {
        $('ask-msg').textContent = e.message;
      }));

      $('upload-form').addEventListener('submit', async (e) => {
        e.preventDefault();
        const modelId = $('model-select').value;
        if (!modelId) {
          $('upload-msg').textContent = 'Select a machine model first.';
          return;
        }
        const form = e.target;
        const fd = new FormData();
        fd.set('title', form.title.value);
        fd.set('scope', 'model');
        fd.set('machineModelId', modelId);
        fd.set('documentType', form.documentType.value);
        if (form.documentVersion.value) fd.set('documentVersion', form.documentVersion.value);
        fd.set('file', form.file.files[0]);
        $('upload-msg').textContent = 'Uploading… processing runs in the background.';
        try {
          const data = await api('/manuals', { method: 'POST', body: fd, form: true, timeoutMs: 60000 });
          $('upload-msg').textContent = `Queued job ${data.processingJob?.id || ''}. Refresh manuals after indexing completes.`;
          await loadManuals();
        } catch (err) {
          $('upload-msg').textContent = err.message;
        }
      });

      async function run(kind) {
        const query = $('query').value.trim();
        if (!query) {
          $('ask-msg').textContent = 'Enter a query.';
          return;
        }
        const path = kind === 'search' ? '/retrieval/search' : kind === 'debug' ? '/rag/debug' : '/rag/answer';
        $('ask-msg').textContent = kind === 'search' ? 'Searching…' : 'Generating from retrieved evidence…';
        $('result').textContent = 'Working…';
        try {
          const data = await api(path, { method: 'POST', body: scopeBody(query), timeoutMs: 125000 });
          $('ask-msg').textContent = `status: ${data.status}`;
          renderResult(data);
        } catch (err) {
          $('ask-msg').textContent = err.message;
          $('result').innerHTML = `<p class="text-red-400">${escapeHtml(err.message)}</p>`;
        }
      }

      $('search-btn').addEventListener('click', () => run('search'));
      $('answer-btn').addEventListener('click', () => run('answer'));
      $('debug-btn').addEventListener('click', () => run('debug'));
      $('show-raw').addEventListener('change', () => {
        if (lastResult) renderResult(lastResult);
      });

      paintUser();
      loadStatus();
      if (token()) loadModels().catch((e) => { $('auth-msg').textContent = e.message; });
    </script>
  </body>
</html>
