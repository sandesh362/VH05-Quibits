# nginx config for the frontend container.
#
# Two jobs:
#   1. Serve the React single-page app.
#   2. Reverse-proxy /api to the Express container so the browser stays on one
#      origin. This is why the frontend never needs CORS or a backend hostname.

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Do not advertise the nginx version.
    server_tokens off;

    # Sensible security headers for a local app. No HSTS: this is plain HTTP
    # on localhost, and HSTS would poison the browser for other localhost apps.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # ---------------------------------------------------------------------
    # API proxy
    # ---------------------------------------------------------------------
    location /api/ {
        # "api" is the Compose service name, resolved on itp-net.
        # The variable + resolver forces runtime DNS resolution, so nginx
        # starts even if the API container is not up yet.
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $api_upstream http://api:8080;

        proxy_pass $api_upstream$request_uri;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Preserve the correlation id across the hop.
        proxy_set_header X-Request-Id      $http_x_request_id;

        # Readiness probes dependencies and can legitimately take a while.
        proxy_connect_timeout 10s;
        proxy_send_timeout    60s;
        proxy_read_timeout    60s;

        # Uploads arrive from Phase 3; generous but bounded.
        client_max_body_size 60m;

        # Streaming responses (Phase 5) must not be buffered.
        proxy_buffering off;
    }

    # ---------------------------------------------------------------------
    # Static assets - content-hashed by Vite, so cache them hard.
    # ---------------------------------------------------------------------
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # ---------------------------------------------------------------------
    # SPA fallback - client-side routes must return index.html, never 404.
    # ---------------------------------------------------------------------
    location / {
        try_files $uri $uri/ /index.html;

        # index.html itself must never be cached, or users get a stale bundle.
        add_header Cache-Control "no-store, must-revalidate";
    }

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
}
