[project]
name = "itp-rag-service"
version = "0.1.0"
description = "FastAPI document-processing and RAG service (Phase 1: infrastructure foundation)"
requires-python = ">=3.11"
license = { text = "UNLICENSED" }

dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
    "httpx>=0.27.0",
    "motor>=3.6.0",
    "structlog>=24.4.0",
    "python-dotenv>=1.0.1",
    "PyMuPDF>=1.24.0",
    "pillow>=10.0.0",
    "pytesseract>=0.3.13",
    "qdrant-client>=1.9.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.8.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-v --tb=short"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "SIM"]
ignore = ["B008"]  # FastAPI Depends() in defaults is idiomatic

[tool.ruff.lint.per-file-ignores]
"app/rag/prompt.py" = ["E501"]
"tests/**" = ["E501"]
